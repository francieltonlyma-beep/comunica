name: Publish attachment fix once
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-hosting-deploy.yml
permissions:
  contents: read
  checks: write
concurrency:
  group: firebase-hosting-production
  cancel-in-progress: false
jobs:
  deploy_hosting:
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_API_KEY: AIzaSyAj3iR_upKAW5Iy0IKnqdcUgnEsbIaoCMo
      VITE_FIREBASE_AUTH_DOMAIN: comunica-salvador.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: comunica-salvador
      VITE_FIREBASE_STORAGE_BUCKET: comunica-salvador.firebasestorage.app
      VITE_FIREBASE_MESSAGING_SENDER_ID: '328110966548'
      VITE_FIREBASE_APP_ID: '1:328110966548:web:64c36a5985214157422401'
      VITE_APP_DATA_ID: comunica-salvador
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validate production configuration
        shell: bash
        run: |
          if [ "$VITE_FIREBASE_PROJECT_ID" != "comunica-salvador" ]; then
            echo "::error::The production Firebase project must be comunica-salvador."
            exit 1
          fi
      - run: node --test tests/*.test.mjs
      - run: npm run build
      - name: Deploy Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COMUNICA_SALVADOR }}
          projectId: comunica-salvador
          channelId: live
