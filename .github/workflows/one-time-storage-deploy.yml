name: Publish Firebase Storage rules once
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-storage-deploy.yml
permissions:
  contents: read
concurrency:
  group: firebase-storage-production
  cancel-in-progress: false
jobs:
  deploy_storage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Authenticate Firebase deployment
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COMUNICA_SALVADOR }}
      - name: Install Firebase Admin SDK
        run: npm --prefix functions ci --omit=dev
      - name: Publish verified Storage rules to the configured bucket
        run: |
          node <<'NODE'
          const { readFileSync } = require('node:fs');
          const { initializeApp } = require('./functions/node_modules/firebase-admin/app');
          const { getSecurityRules } = require('./functions/node_modules/firebase-admin/security-rules');

          async function publish() {
            initializeApp({
              projectId: 'comunica-salvador',
              storageBucket: 'comunica-salvador.firebasestorage.app',
            });

            const source = readFileSync('storage.rules', 'utf8');
            const ruleset = await getSecurityRules().releaseStorageRulesetFromSource(
              source,
              'comunica-salvador.firebasestorage.app',
            );
            console.log(`Published Storage ruleset: ${ruleset.name}`);
          }

          publish().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
