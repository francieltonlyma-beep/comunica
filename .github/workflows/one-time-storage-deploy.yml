name: Publish Firebase Storage rules once
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-storage-deploy.yml
permissions:
  contents: read
concurrency:
  group: firebase-storage-production
  cancel-in-progress: false
jobs:
  deploy_storage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Authenticate Firebase deployment
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COMUNICA_SALVADOR }}
      - name: Publish verified Storage rules
        run: npx firebase-tools@15.34.0 deploy --project comunica-salvador --only storage
