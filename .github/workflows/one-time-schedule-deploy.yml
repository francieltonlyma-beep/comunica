name: Publish schedule filters once
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-schedule-deploy.yml
permissions:
  contents: read
  checks: write
concurrency:
  group: firebase-schedule-production-one-time
  cancel-in-progress: false
jobs:
  deploy_production:
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_API_KEY: AIzaSyAj3iR_upKAW5Iy0IKnqdcUgnEsbIaoCMo
      VITE_FIREBASE_AUTH_DOMAIN: comunica-salvador.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: comunica-salvador
      VITE_FIREBASE_STORAGE_BUCKET: comunica-salvador.firebasestorage.app
      VITE_FIREBASE_MESSAGING_SENDER_ID: '328110966548'
      VITE_FIREBASE_APP_ID: '1:328110966548:web:64c36a5985214157422401'
      VITE_APP_DATA_ID: comunica-salvador
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/*.test.mjs
      - run: npm run build
      - name: Deploy Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COMUNICA_SALVADOR }}
          projectId: comunica-salvador
          channelId: live
      - name: Authenticate for Firestore rules
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COMUNICA_SALVADOR }}
      - name: Verify deployment identity and IAM
        shell: bash
        run: |
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS,'utf8'));console.log('Authenticated as '+c.client_email)"
          gcloud projects get-iam-policy comunica-salvador --flatten='bindings[].members' --filter='bindings.members:github-action-1283306892@comunica-salvador.iam.gserviceaccount.com' --format='value(bindings.role)'
      - name: Deploy Firestore rules
        run: npx --yes firebase-tools deploy --only firestore:rules --project comunica-salvador --non-interactive
