name: Test and publish Comunica
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  checks: write
concurrency:
  group: firebase-hosting-production
  cancel-in-progress: false
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY || secrets.VITE_FIREBASE_API_KEY || 'AIzaSyAj3iR_upKAW5Iy0IKnqdcUgnEsbIaoCMo' }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN || secrets.VITE_FIREBASE_AUTH_DOMAIN || 'comunica-salvador.firebaseapp.com' }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID || secrets.VITE_FIREBASE_PROJECT_ID || 'comunica-salvador' }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET || secrets.VITE_FIREBASE_STORAGE_BUCKET || 'comunica-salvador.firebasestorage.app' }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID || secrets.VITE_FIREBASE_MESSAGING_SENDER_ID || '328110966548' }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID || secrets.VITE_FIREBASE_APP_ID || '1:328110966548:web:64c36a5985214157422401' }}
      VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID || secrets.VITE_FIREBASE_MEASUREMENT_ID }}
      VITE_FIREBASE_VAPID_KEY: ${{ vars.VITE_FIREBASE_VAPID_KEY || secrets.VITE_FIREBASE_VAPID_KEY }}
      VITE_APP_DATA_ID: ${{ vars.VITE_APP_DATA_ID || 'comunica-salvador' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/*.test.mjs
      - run: npm run build
      - name: Validate production configuration before deploying
        shell: bash
        run: |
          for name in VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_STORAGE_BUCKET VITE_FIREBASE_MESSAGING_SENDER_ID VITE_FIREBASE_APP_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Configure $name in repository Actions variables or secrets."
              exit 1
            fi
          done
          if [ "$VITE_FIREBASE_PROJECT_ID" != "comunica-salvador" ]; then
            echo "::error::The production Firebase project must be comunica-salvador."
            exit 1
          fi
      - name: Authenticate Firebase deployment
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COMUNICA_SALVADOR }}
      - name: Install Firebase Admin SDK for rules deployment
        run: npm --prefix functions ci --omit=dev
      - name: Deploy Firebase Storage rules
        working-directory: functions
        run: |
          node <<'NODE'
          const { readFileSync } = require('node:fs');
          const { initializeApp } = require('firebase-admin/app');
          const { getSecurityRules } = require('firebase-admin/security-rules');

          async function deployStorageRules() {
            initializeApp({
              projectId: 'comunica-salvador',
              storageBucket: 'comunica-salvador.firebasestorage.app',
            });

            const source = readFileSync('../storage.rules', 'utf8');
            const ruleset = await getSecurityRules().releaseStorageRulesetFromSource(
              source,
              'comunica-salvador.firebasestorage.app',
            );
            console.log(`Published Storage ruleset: ${ruleset.name}`);
          }

          deployStorageRules().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
      - name: Deploy Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COMUNICA_SALVADOR }}
          projectId: comunica-salvador
          channelId: live
