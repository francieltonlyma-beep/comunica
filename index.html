<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/pwa/apple-touch-icon.png" />
    <meta name="theme-color" content="#071a36" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Comunica" />
    <meta name="application-name" content="Comunica" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Comunica</title>
    <script>
      try {
        if (localStorage.getItem('comunica_theme') === 'dark') {
          document.documentElement.classList.add('comunica-dark');
          document.querySelector('meta[name="theme-color"]').content = '#0b1220';
        }
      } catch { /* A tela abre com o tema claro. */ }
    </script>
    <style>
      html { background-color: #f1f5f9; }
      html.comunica-dark { background-color: #0b1220; color-scheme: dark; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
